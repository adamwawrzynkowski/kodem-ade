# Release highlights: the cards of the What's new board, which Kodem draws itself.
#
# A release shows the entries that the previous release of its channel did not have: Nightly
# compares this file with the previous Nightly tag, Production with the previous Production tag.
# So add new entries at the top, and never rename, reuse or delete the `id` of an entry that a
# release shipped. The board shows the newest new headline and the new highlights in file order.
# Every commit subject still appears in the folded list under the board.
#
# Release commands refuse to start until `reviewed` names the newest commit whose changes this
# file has considered: every commit since the previous release, other than the commits that only
# change this file, must be an ancestor of it or be it. Commit changes of this file alone, with a
# subject that starts with "Changelog:". Those commits are left out of the commit list.
#
# Format (build.rs checks it, so `cargo build` reports a mistake):
#
#   [[headline]]       One sentence for the version card: what this version brings.
#   id, text           text: at most 140 characters.
#
#   [[highlight]]      One card.
#   id                 Lowercase letters, digits and hyphens, unique in this file.
#   title              At most 40 characters. A human title, not the commit subject.
#   text               At most 160 characters. What the user notices, in plain words.
#   wide = true        Optional. The card takes two of the board's four columns.
#   tone               Optional: accent (default), green, red, amber, blue or muted.
#   visual             Optional. A small live picture above the title, one of:
#     { kind = "list", title = "…", badge = "…", items = [{ text = "…", state = "done", tag = "…", tone = "…" }] }
#         1–5 rows. state: done, open, dot (a filled mark in the tone) or faded. A title draws the
#         rows as a tree under it; without one, each row is a small plate. title, badge, tag and
#         tone are optional.
#     { kind = "chips", items = [{ text = "…", icon = "…", detail = "…", added = 0, removed = 0, tone = "…" }] }
#         1–4 capsules. All fields but text are optional. added and removed draw a diffstat.
#     { kind = "prompt", text = "…", chips = [ …as above… ] }
#         A composer with a draft and optional capsules above it.
#     { kind = "bars", label = "…", values = [3, 5, 2], labels = ["…"], focus = 0 }
#         2–8 dot-matrix bars. labels (one per bar) and focus (the lit bar's index) are optional.
#     { kind = "figure", value = "72", label = "…", detail = "…" }
#         A dot-matrix number of at most 7 characters from 0-9 . , % + - x : /, and a caption.
#     { kind = "meter", segments = [{ label = "…", weight = 3, tone = "…" }], caption = "…" }
#         2–4 parts of one dot-matrix bar with their legend.
#     { kind = "keys", keys = ["⌘", "B"], label = "…" }
#         1–4 keycaps of at most 5 characters.
#     { kind = "glyph", icon = "zap" }
#         One large icon.
#   icon names are the files of assets/icons without ".svg".
#
# Cards near each other must look different: a highlight's visual kind (or "none" without one)
# must differ from the kinds of the three highlights above it. Pick the kind that shows the change
# best: a figure or bars for a measured result, keys for a shortcut, a prompt for something typed,
# chips for named things, a meter for shares of a whole, a list for states or steps, a glyph when
# nothing else fits. A wide card shows a figure, keys or a glyph beside its words.
#
# The board has four columns. The version card takes two in the middle of the second row when
# the highlights fill six columns or more; widths that add up to 6, 10, 14… leave no gaps.
# Visual data must be true: measured figures, real names and real shortcuts.

reviewed = "ade89c19b7f27421709ac00a365105da8ca4fe00"

[[headline]]
id = "headline-opencode-2-update-and-polish"
text = "OpenCode 1 now updates to OpenCode 2 from the update card, and buttons, menus and fields get a finer look."

[[highlight]]
id = "opencode-2-update"
title = "OpenCode 1 updates to 2"
text = "The update card now moves OpenCode 1.19.3 to OpenCode 2.1.0 instead of ending with the old version. Older OpenCode 1 versions first update to 1.19."
wide = true
tone = "green"
visual = { kind = "figure", value = "2.1.0", label = "OpenCode 2", detail = "reached from OpenCode 1.19.3" }

[[highlight]]
id = "interface-polish"
title = "A finer look for the interface"
text = "Menus, tooltips and the palette are glass. Buttons sink when pressed, search fields are recessed, and placeholders use the theme's muted color."
wide = true
tone = "blue"
visual = { kind = "glyph", icon = "sparkles" }

[[headline]]
id = "headline-macos-window-keys"
text = "On macOS, ⌘W and ⌘H work, and closing the window asks before Kodem quits."

[[highlight]]
id = "macos-window-management"
title = "Close and hide, the Mac way"
text = "⌘W or the red button asks before Kodem quits, and ⌘Q confirms. ⌘H and Hide Kodem in the menu hide the app."
wide = true
tone = "red"
visual = { kind = "keys", keys = ["⌘", "W"], label = "Close window" }

[[headline]]
id = "headline-usage-panels"
text = "Usage panels are tidier: context and limits sit in their own blocks, and costs read the same everywhere."

[[highlight]]
id = "usage-panels-blocks"
title = "Clearer usage panels"
text = "Context and Limits are separate blocks. Session cost joins the context block, and credits round to the cent, so 2500.0000000000 reads 2,500."
wide = true
tone = "green"
visual = { kind = "list", title = "Usage", badge = "blocks", items = [
    { text = "Context window and session cost", state = "done" },
    { text = "Limits, with refresh and age", state = "done" },
    { text = "Compact now and Rules in the footer", state = "open" },
] }

