# Release highlights: the cards of the What's new board, which Kodem draws itself.
#
# A release shows the entries that the previous release of its channel did not have: Nightly
# compares this file with the previous Nightly tag, Production with the previous Production tag.
# So add new entries at the top, and never rename, reuse or delete the `id` of an entry that a
# release shipped. The board shows the newest new headline and the new highlights in file order.
# Every commit subject still appears in the folded list under the board.
#
# Release commands refuse to start until `reviewed` names the newest commit whose changes this
# file has considered: every commit since the previous release, other than the commits that only
# change this file, must be an ancestor of it or be it. Commit changes of this file alone, with a
# subject that starts with "Changelog:". Those commits are left out of the commit list.
#
# Format (build.rs checks it, so `cargo build` reports a mistake):
#
#   [[headline]]       One sentence for the version card: what this version brings.
#   id, text           text: at most 140 characters.
#
#   [[highlight]]      One card.
#   id                 Lowercase letters, digits and hyphens, unique in this file.
#   title              At most 40 characters. A human title, not the commit subject.
#   text               At most 160 characters. What the user gets, in plain words.
#   wide = true        Optional. The card takes two of the board's four columns.
#   tone               Optional: accent (default), green, red, amber, blue or muted.
#   visual             Required. A live picture on a stage above the title, one of the kinds
#                      below. Every text a visual shows has at most 44 characters.
#     { kind = "list", title = "…", badge = "…", items = [{ text = "…", state = "done", tag = "…", tone = "…" }] }
#         1–4 rows. state: done, open, dot (a filled mark in the tone) or faded. A title draws the
#         rows as a tree under it; without one, each row is a small plate. title, badge, tag and
#         tone are optional. For states, steps of a result, or a short checklist.
#     { kind = "chips", items = [{ text = "…", icon = "…", detail = "…", added = 0, removed = 0, tone = "…" }] }
#         1–4 capsules. All fields but text are optional. added and removed draw a diffstat.
#         For a few named things that work together.
#     { kind = "prompt", text = "…", chips = [ …as above… ] }
#         A composer with a draft and 0–3 capsules above it. For something the user types.
#     { kind = "bars", label = "…", values = [3, 5, 2], labels = ["…"], focus = 0 }
#         2–8 dot-matrix bars. labels (one per bar) and focus (the lit bar's index) are optional.
#         For a measured before and after, or a comparison of amounts.
#     { kind = "figure", value = "72", label = "…", detail = "…" }
#         A dot-matrix number of at most 6 characters from 0-9 . , % + - x : /, and a caption.
#         For one measured result.
#     { kind = "meter", segments = [{ label = "…", weight = 3, tone = "…" }], caption = "…" }
#         2–4 parts of one dot-matrix bar with their legend. For shares of a whole.
#     { kind = "keys", keys = ["⌘", "B"], label = "…" }
#         1–4 keycaps of at most 5 characters. For a shortcut.
#     { kind = "glyph", icon = "zap" }
#         One large icon. Only when no other kind fits.
#     { kind = "tiles", items = [{ text = "…", icon = "…", badge = "…", tone = "…" }] }
#         1–4 large icon tiles with a name of at most 14 characters. badge and tone are optional.
#         For new agents, providers, avatars and other things with an icon of their own.
#     { kind = "toggles", items = [{ text = "…", on = true, detail = "…" }] }
#         1–3 settings rows with a switch. detail is optional. For new on/off settings.
#     { kind = "sliders", items = [{ text = "…", value = 0.5, readout = "…" }] }
#         1–3 settings rows with a slider; value places the thumb from 0 to 1. readout is
#         optional. For settings with a range.
#     { kind = "compare", before = { …a chip… }, after = { …a chip… }, label = "…" }
#         A capsule as it was, an arrow and the capsule as it is now; the before detail is struck
#         through. label is optional. For a rename, a state that ended (BETA) or a new default.
#     { kind = "menu", items = [{ text = "…", icon = "…", keys = "⌘C" }], focus = 1 }
#         2–4 rows of a menu. icon, keys and focus (the lit row's index) are optional. For new
#         menu entries and commands.
#     { kind = "window", area = "terminal", label = "…" }
#         A sketch of the Kodem window with one area lit: titlebar, sidebar, chat, composer,
#         terminal (with its drag grip) or panel (a side panel). label is optional. For where a
#         change lives in the window.
#     { kind = "gauge", value = 0.42, text = "42%", label = "…" }
#         A dot-matrix ring filled to value from 0 to 1, with text of at most 5 characters in its
#         middle (optional) and a label. For usage, limits and progress.
#     { kind = "steps", items = ["…", "…"], current = 1 }
#         2–4 steps of at most 14 characters along a line; those before current are done, and
#         current may be the count of steps when all are done. For a flow.
#     { kind = "diff", file = "…", lines = [{ text = "…", change = "added" }] }
#         1–4 lines of a change: added, removed or same. file is optional. For Git and code.
#     { kind = "notice", icon = "…", title = "…", text = "…", actions = ["…", "…"] }
#         A dialog or notification with 0–2 buttons; the last is the main one. text is optional.
#         For new dialogs, confirmations and notifications.
#     { kind = "choice", question = "…", options = ["…", "…"], chosen = 0 }
#         A question with 2–3 options, one of them chosen (optional). For questions and pickers.
#   icon names are the files of assets/icons without ".svg".
#
# Cards near each other must look different: a highlight's visual kind must differ from the
# kinds of the three highlights above it. Pick the kind that shows the change best, using the
# hints above.
#
# The board has four columns. The version card takes two in the middle of the second row when
# the highlights fill six columns or more; widths that add up to 6, 10, 14… leave no gaps.
# Visual data must be true: measured figures, real names, real labels and real shortcuts.
#
# Write for the people who use Kodem, not for its developers. These are release notes:
# - Say what the user can do now or what got better, in plain words, present tense and active
#   voice. Talk to the user ("you") where it reads naturally. Lead with the benefit, then say
#   where to find it.
# - Leave out how it was built: no type, file, function or setting-key names, no rendering
#   terms (textures, sprites, redraws, frames), no commit wording ("Add", "Fix", "Refactor").
# - Titles are short sentence-case phrases a user would say ("Resize the terminal"), texts one
#   or two short sentences. No lists of every place a change touches.
# - Never describe a change as a move from one version to another ("OpenCode 1 updates to 2",
#   "1.19.3 to 2.1.0") in a headline, title, text or visual. Say what the user can do now.
#   build.rs refuses version numbers such as 1.19.3.

