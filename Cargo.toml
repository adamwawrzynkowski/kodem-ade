[workspace]
members = ["crates/kodem-core", "crates/kodem-host", "crates/kodem-desktop", "crates/kodem-git", "crates/kodem-update", "crates/kodem-voice"]
# Patched copies of dependencies build as dependencies, not as members.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
# The first release of the X.Y scheme, after Nightly 0.1.60. The release commands raise the minor
# version from the newest release: 0.61, 0.62, 0.63…
version = "0.61.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
gpui = { package = "gpui-ce", version = "=0.2.2", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit"] }

# The UI thread spends most of a frame in dependencies: GPUI's layout, text shaping, scene
# building and SVG rasterization. Unoptimized, they make the debug app several times slower than
# a release build. Dependencies are optimized; Kodem itself stays unoptimized with Debug
# assertions and symbols.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# GPUI's macOS renderer, patched so that a blur works on the region around its shape. See
# vendor/gpui_ce_macos/src/region_blur.rs.
[patch.crates-io]
gpui_ce_macos = { path = "vendor/gpui_ce_macos" }
# GPUI's Windows renderer, patched so that its composition lies behind child windows, such as the
# web views of the browser pane. See vendor/gpui_ce_windows/src/directx_renderer.rs.
gpui_ce_windows = { path = "vendor/gpui_ce_windows" }
# GPUI, patched so that nested scroll containers chain a wheel gesture: the innermost container
# that can move takes each axis, and its ancestors scroll only once it reaches its end. See
# vendor/gpui_ce/src/scroll_chain.rs.
gpui-ce = { path = "vendor/gpui_ce" }
