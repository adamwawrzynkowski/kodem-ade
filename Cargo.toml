[workspace]
members = ["crates/kodem-core", "crates/kodem-host", "crates/kodem-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
gpui = { package = "gpui-ce", version = "=0.2.2", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"
