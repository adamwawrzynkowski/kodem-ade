# Releases Kodem for every platform: chooses the version and change list, builds macOS,
# Windows (x64 and Arm64) and Linux in parallel, and stages one draft release with all of them.
# Nothing is staged unless every requested build succeeds. Each platform has an update archive,
# which installed apps download, and an installer for a first installation: a disk image on
# macOS, a setup program on Windows and a self-extracting script on Linux.
#
# Start it with Run workflow here, or with Build Release Nightly / Production on your computer
# (scripts/release.sh), which follows its progress and then publishes the draft. A ruleset
# reserves release tags for the owner's accounts, so after Run workflow, publish the draft on
# the Releases page; that creates the tag.
#
# Optional configuration in the repository's Actions settings:
#   Secrets  SIGNPATH_API_TOKEN                               SignPath CI user's API token
#            KODEM_SIGN_PFX_BASE64, KODEM_SIGN_PFX_PASSWORD   Authenticode certificate (.pfx, base64)
#            KODEM_GPG_PRIVATE_KEY, KODEM_GPG_PASSPHRASE      OpenPGP key for the Linux .asc signatures
#   Variables SIGNPATH_ORGANIZATION_ID                        turns on signing with SignPath
#             SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#             KODEM_GPG_KEY                                   that key's ID or fingerprint
#             KODEM_REQUIRE_SIGNING=1                         refuses unsigned Windows executables
# SignPath signs the Windows executables, then the installers that hold them, with the artifact
# configurations `executables` and `installers` (.signpath/artifact-configurations/). Otherwise
# a .pfx certificate signs them. Without either, Windows executables are unsigned.
name: Release packages
run-name: Release ${{ inputs.channel }}${{ inputs.request && format(' · {0}', inputs.request) || '' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [nightly, production]
      commit:
        description: Commit to release (empty for the newest commit of the branch)
        required: false
        type: string
      version:
        description: Version (X.X.X; empty for the next patch version)
        required: false
        type: string
      platforms:
        description: Platforms to build
        required: true
        default: macos windows linux
        type: string
      request:
        description: Set by scripts/release.sh to find this run
        required: false
        type: string

permissions:
  contents: read

# One release of a channel at a time, so two runs never choose the same version.
concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  KODEM_CHANNEL: ${{ inputs.channel }}
  KODEM_RELEASE_PLATFORMS: ${{ inputs.platforms }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      previous: ${{ steps.plan.outputs.previous }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      # Stop before any build if Windows signing is required or half configured, instead of
      # after an hour of builds.
      - name: Check Windows signing
        if: contains(inputs.platforms, 'windows') && (vars.KODEM_REQUIRE_SIGNING == '1' || vars.SIGNPATH_ORGANIZATION_ID != '')
        env:
          HAS_CERTIFICATE: ${{ secrets.KODEM_SIGN_PFX_BASE64 != '' }}
          HAS_SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [[ -n "$SIGNPATH_ORGANIZATION_ID" ]]; then
              if [[ "$HAS_SIGNPATH_TOKEN" != true || -z "$SIGNPATH_PROJECT_SLUG" || -z "$SIGNPATH_SIGNING_POLICY_SLUG" ]]; then
                  echo "::error::SIGNPATH_ORGANIZATION_ID is set, but the SIGNPATH_API_TOKEN secret or the SIGNPATH_PROJECT_SLUG or SIGNPATH_SIGNING_POLICY_SLUG variable is missing."
                  exit 1
              fi
          elif [[ "$HAS_CERTIFICATE" != true ]]; then
              echo "::error::KODEM_REQUIRE_SIGNING is set, but neither SignPath nor the KODEM_SIGN_PFX_BASE64 secret is configured."
              exit 1
          fi
      - name: Choose the version and the change list
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          KODEM_VERSION: ${{ inputs.version }}
        run: scripts/release.sh plan "$KODEM_CHANNEL"

  macos:
    name: macOS
    needs: plan
    if: contains(inputs.platforms, 'macos')
    # AppKit draws the window controls and other system chrome in the style of the SDK that
    # the app links against, so the release must link against the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      KODEM_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      KODEM_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      KODEM_RELEASE_PREVIOUS: ${{ needs.plan.outputs.previous }}
      KODEM_RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The build cache restores target/, but packages of earlier runs must not come back: the
      # cache prunes files inside them, and the build refuses to replace a bundle it cannot read.
      - name: Remove packages restored by the cache
        run: rm -rf "target/$KODEM_CHANNEL"
      - name: Require the macOS 27 SDK
        run: |
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk_version"
          [[ "${sdk_version%%.*}" -ge 27 ]] || { echo "The release must link against the macOS 27 SDK or newer." >&2; exit 1; }
      - name: Build and package
        run: scripts/build-macos.sh "$KODEM_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-macos
          path: target/${{ inputs.channel }}/Kodem-macos-*
          if-no-files-found: error
          retention-days: 3
      - name: Keep packages out of the cache
        if: always()
        run: rm -rf "target/$KODEM_CHANNEL"

  windows:
    name: Windows
    needs: plan
    if: contains(inputs.platforms, 'windows')
    # Visual Studio on this image has the x64 and Arm64 C++ tools and the Windows SDK.
    runs-on: windows-2022
    timeout-minutes: 300
    # SignPath reads this job and downloads the artifacts that it signs.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      KODEM_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      KODEM_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      KODEM_RELEASE_PREVIOUS: ${{ needs.plan.outputs.previous }}
      KODEM_RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
      KODEM_REQUIRE_SIGNING: ${{ vars.KODEM_REQUIRE_SIGNING }}
      KODEM_SIGN_PFX_PASSWORD: ${{ secrets.KODEM_SIGN_PFX_PASSWORD }}
      # SignPath signs between the steps of scripts/build-windows.sh, which then checks its work.
      KODEM_SIGN_EXTERNALLY: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && '1' || '0' }}
      KODEM_WINDOWS_ARCH: x86_64 aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.KODEM_SIGN_PFX_BASE64 }}
        run: |
          if [[ -n "$CERTIFICATE" ]]; then
              certificate="$(cygpath -u "$RUNNER_TEMP")/kodem-signing.pfx"
              printf '%s' "$CERTIFICATE" | base64 -d > "$certificate"
              echo "KODEM_SIGN_PFX=$certificate" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The build cache restores target/, but packages of earlier runs must not come back: the
      # cache prunes files inside them, and the build refuses to replace a bundle it cannot read.
      - name: Remove packages restored by the cache
        run: rm -rf "target/$KODEM_CHANNEL"
      - name: Install NSIS
        run: |
          source scripts/dependencies.sh
          kodem_makensis >/dev/null 2>&1 || choco install nsis --yes --no-progress
      - name: Build and sign the executables
        run: scripts/build-windows.sh "$KODEM_CHANNEL" compile
      - name: Collect the executables for SignPath
        id: executables
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-executables
          path: target/${{ inputs.channel }}/windows-*/
          if-no-files-found: error
          retention-days: 1
      # A release signing policy can wait for a person to approve the request.
      - name: Sign the executables with SignPath
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.executables.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-executables
      - name: Use the signed executables
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        run: cp -R "$(cygpath -u "$RUNNER_TEMP")/signed-executables/." "target/$KODEM_CHANNEL/"
      - name: Package the update archives and the installers
        run: scripts/build-windows.sh "$KODEM_CHANNEL" package
      - name: Collect the installers for SignPath
        id: installers
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: target/${{ inputs.channel }}/Kodem-windows-*-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installers with SignPath
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installers
      - name: Use the signed installers
        if: env.KODEM_SIGN_EXTERNALLY == '1'
        run: cp "$(cygpath -u "$RUNNER_TEMP")/signed-installers/"Kodem-windows-*-setup.exe "target/$KODEM_CHANNEL/"
      - name: Write the checksums
        run: scripts/build-windows.sh "$KODEM_CHANNEL" finish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-windows
          path: target/${{ inputs.channel }}/Kodem-windows-*
          if-no-files-found: error
          retention-days: 3
      - name: Keep packages out of the cache
        if: always()
        run: rm -rf "target/$KODEM_CHANNEL"
      - name: Remove the signing certificate
        if: always()
        run: rm -f "$(cygpath -u "$RUNNER_TEMP")/kodem-signing.pfx"

  linux:
    name: Linux
    needs: plan
    if: contains(inputs.platforms, 'linux')
    # The package needs this glibc (2.35) or newer, which covers current distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KODEM_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      KODEM_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      KODEM_RELEASE_PREVIOUS: ${{ needs.plan.outputs.previous }}
      KODEM_RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
      KODEM_GPG_KEY: ${{ vars.KODEM_GPG_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libxcb1-dev libwayland-dev
      - name: Import the OpenPGP key
        env:
          PRIVATE_KEY: ${{ secrets.KODEM_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.KODEM_GPG_PASSPHRASE }}
        run: |
          if [[ -n "$PRIVATE_KEY" ]]; then
              mkdir -p -m 700 ~/.gnupg
              printf '%s' "$PRIVATE_KEY" | gpg --batch --import
              if [[ -n "$PASSPHRASE" ]]; then
                  printf '%s' "$PASSPHRASE" > ~/.gnupg/kodem-passphrase
                  chmod 600 ~/.gnupg/kodem-passphrase
                  printf 'pinentry-mode loopback\npassphrase-file %s\n' ~/.gnupg/kodem-passphrase >> ~/.gnupg/gpg.conf
              fi
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The build cache restores target/, but packages of earlier runs must not come back: the
      # cache prunes files inside them, and the build refuses to replace a bundle it cannot read.
      - name: Remove packages restored by the cache
        run: rm -rf "target/$KODEM_CHANNEL"
      - name: Build and package
        run: scripts/build-linux.sh "$KODEM_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-linux
          path: target/${{ inputs.channel }}/Kodem-linux-*
          if-no-files-found: error
          retention-days: 3
      - name: Keep packages out of the cache
        if: always()
        run: rm -rf "target/$KODEM_CHANNEL"

  publish:
    name: Stage release
    needs: [plan, macos, windows, linux]
    # Skipped platforms are allowed; a failed or cancelled build stops publication.
    if: >-
      always() && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The only job that can write. It creates the draft; a draft has no tag yet.
    permissions:
      contents: write
    env:
      KODEM_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      KODEM_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      KODEM_RELEASE_STAGE_ONLY: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      # Outside the checkout, which must stay clean for publication. Only the packages: the
      # artifacts that SignPath signed hold earlier, unsigned copies.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Verify and stage the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release.sh publish "$KODEM_CHANNEL" "$RUNNER_TEMP/packages" | tee "$RUNNER_TEMP/stage.log"
          draft=$(sed -n 's/^STAGED: //p' "$RUNNER_TEMP/stage.log")
          {
            echo "### Draft release ready"
            echo "[Open the draft]($draft) and choose **Publish release**, or run the Build Release command, which publishes it for you."
          } >> "$GITHUB_STEP_SUMMARY"
