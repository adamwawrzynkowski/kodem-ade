# Checks every pull request and every change to main: formatting and Clippy with warnings denied
# on macOS, Windows and Linux. The main branch ruleset requires these checks. Licenses are checked
# only by release builds (scripts/licenses.py prepare in the build scripts).
# Pull requests from forks run with a read-only token and no secrets.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libxcb1-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      # Voice input builds whisper.cpp with its Vulkan backend on Linux and x64 Windows. CMake
      # and libclang come with the runner images.
      - name: Install the Vulkan SDK
        if: runner.os != 'macOS'
        shell: bash
        run: scripts/install-vulkan-sdk.sh "$RUNNER_TEMP/vulkan"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
