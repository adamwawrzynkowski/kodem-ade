[package]
name = "kodem-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kodem"
path = "src/main.rs"

[dependencies]
kodem-core = { path = "../kodem-core" }
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
semver = "1"
serde_json.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
unicode-segmentation = "1.12"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "pnm"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
